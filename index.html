<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TS CyberClub — Онлайн-Бронирование</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    body { background-color: #0b0f19; color: #f3f4f6; font-family: system-ui, -apple-system, sans-serif; }
    .glass-panel { background: rgba(17, 24, 39, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .pc-card { transition: all 0.2s ease; cursor: pointer; }
    .pc-card:hover { transform: translateY(-2px); }
    .pc-selected { border-color: #3b82f6 !important; background: rgba(59, 130, 246, 0.15) !important; box-shadow: 0 0 15px rgba(59, 130, 246, 0.3); }
    .pc-busy { border-color: #ef4444 !important; background: rgba(239, 68, 68, 0.1) !important; cursor: not-allowed; }
  </style>
</head>
<body class="p-4 md:p-8 max-w-5xl mx-auto">

  <!-- Шапка -->
  <header class="glass-panel rounded-2xl p-4 mb-6 flex flex-wrap justify-between items-center gap-4">
    <div class="flex items-center gap-3">
      <div class="w-12 h-12 bg-blue-600 rounded-xl flex items-center justify-center text-2xl font-bold shadow-lg shadow-blue-500/30">TS</div>
      <div>
        <h1 class="text-xl font-bold tracking-wide">TS CYBERCLUB</h1>
        <p class="text-xs text-slate-400" id="live-clock">Загрузка времени...</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <span class="px-3 py-1 bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 rounded-full text-xs font-semibold">
        <i class="fa-solid fa-circle text-[8px] mr-1 animate-pulse"></i> Онлайн Бронь
      </span>
    </div>
  </header>

  <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
    <!-- Карта ПК -->
    <div class="lg:col-span-2 space-y-4">
      <div class="glass-panel p-5 rounded-2xl">
        <h2 class="text-lg font-bold mb-4 flex items-center justify-between">
          <span><i class="fa-solid fa-desktop mr-2 text-blue-400"></i>Выберите ПК</span>
          <span class="text-xs font-normal text-slate-400">Доступно: 20 ПК</span>
        </h2>
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3" id="pc-grid">
          <!-- ПК карточки генерируются JS -->
        </div>
      </div>
    </div>

    <!-- Форма Бронирования -->
    <div class="glass-panel p-5 rounded-2xl h-fit">
      <h2 class="text-lg font-bold mb-4 flex items-center gap-2">
        <i class="fa-solid fa-receipt text-blue-400"></i> Оформление Брони
      </h2>

      <form id="booking-form" onsubmit="handleBooking(event)" class="space-y-4">
        <div>
          <label class="text-xs text-slate-400 block mb-1">Выбранные ПК</label>
          <input type="text" id="selected-pcs-display" readonly placeholder="Выберите место на карте" required
                 class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-blue-400 font-bold focus:outline-none">
        </div>

        <div>
          <label class="text-xs text-slate-400 block mb-1">Ваше Имя</label>
          <input type="text" id="client-name" placeholder="Например: Александр" required
                 class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:border-blue-500 focus:outline-none">
        </div>

        <div>
          <label class="text-xs text-slate-400 block mb-1">Номер Телефона</label>
          <input type="tel" id="client-phone" placeholder="87771234567" required
                 class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:border-blue-500 focus:outline-none">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-xs text-slate-400 block mb-1">Дата</label>
            <input type="date" id="booking-date" required
                   class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none">
          </div>
          <div>
            <label class="text-xs text-slate-400 block mb-1">Время прибытия</label>
            <!-- Заменено на надежный селектор времени без ошибок типа на моб. устройствах -->
            <select id="booking-time" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none">
              <!-- Динамически заполняется 24ч временем -->
            </select>
          </div>
        </div>

        <div>
          <label class="text-xs text-slate-400 block mb-1">Тариф</label>
          <select id="tariff-select" onchange="calculateTotal()" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none">
            <option value="1000" data-hours="1">1 Час — 1 000 ₸</option>
            <option value="2000" data-hours="2">2 Часа — 2 000 ₸</option>
            <option value="1400" data-hours="3">Акция 2+1 — 1 400 ₸ (3 ч)</option>
            <option value="2100" data-hours="5">Акция 3+2 — 2 100 ₸ (5 ч)</option>
            <option value="1500" data-hours="8">Ночь Будни — 1 500 ₸</option>
            <option value="2000" data-hours="8">Ночь Выходные — 2 000 ₸</option>
          </select>
        </div>

        <!-- Напитки предзаказ -->
        <div>
          <label class="text-xs text-slate-400 block mb-2">Напитки (по желанию)</label>
          <div class="grid grid-cols-3 gap-2">
            <div class="bg-slate-900/60 p-2 rounded-xl text-center border border-slate-800">
              <p class="text-xs font-semibold">Gorilla</p>
              <p class="text-[10px] text-amber-400 mb-1">700 ₸</p>
              <div class="flex items-center justify-center gap-1">
                <button type="button" onclick="changeDrink('gorilla', -1)" class="w-5 h-5 bg-slate-800 rounded text-xs">-</button>
                <span id="drink-gorilla" class="text-xs font-bold">0</span>
                <button type="button" onclick="changeDrink('gorilla', 1)" class="w-5 h-5 bg-slate-800 rounded text-xs">+</button>
              </div>
            </div>
            <div class="bg-slate-900/60 p-2 rounded-xl text-center border border-slate-800">
              <p class="text-xs font-semibold">Dizzy</p>
              <p class="text-[10px] text-amber-400 mb-1">700 ₸</p>
              <div class="flex items-center justify-center gap-1">
                <button type="button" onclick="changeDrink('dizzy', -1)" class="w-5 h-5 bg-slate-800 rounded text-xs">-</button>
                <span id="drink-dizzy" class="text-xs font-bold">0</span>
                <button type="button" onclick="changeDrink('dizzy', 1)" class="w-5 h-5 bg-slate-800 rounded text-xs">+</button>
              </div>
            </div>
            <div class="bg-slate-900/60 p-2 rounded-xl text-center border border-slate-800">
              <p class="text-xs font-semibold">Moxito</p>
              <p class="text-[10px] text-amber-400 mb-1">600 ₸</p>
              <div class="flex items-center justify-center gap-1">
                <button type="button" onclick="changeDrink('moxito', -1)" class="w-5 h-5 bg-slate-800 rounded text-xs">-</button>
                <span id="drink-moxito" class="text-xs font-bold">0</span>
                <button type="button" onclick="changeDrink('moxito', 1)" class="w-5 h-5 bg-slate-800 rounded text-xs">+</button>
              </div>
            </div>
          </div>
        </div>

        <div class="pt-2 border-t border-slate-800 flex justify-between items-center">
          <span class="text-xs text-slate-400">Итого:</span>
          <span id="total-price" class="text-xl font-extrabold text-amber-400">1 000 ₸</span>
        </div>

        <button type="submit" class="w-full py-3 bg-gradient-to-r from-blue-600 to-cyan-500 rounded-xl font-bold text-white shadow-lg shadow-blue-500/20 active:scale-95 transition-transform">
          <i class="fa-paper-plane fa-solid mr-2"></i>Отправить бронь на кассу
        </button>
      </form>
    </div>
  </div>

  <script>
    const state = {
      selectedPcs: [],
      drinks: { gorilla: 0, dizzy: 0, moxito: 0 }
    };

    const drinkPrices = { gorilla: 700, dizzy: 700, moxito: 600 };

    // Инициализация
    window.onload = () => {
      renderPcs();
      populateTimeOptions();
      setTodayDate();
      setInterval(updateClock, 1000);
      updateClock();
    };

    function updateClock() {
      const now = new Date();
      document.getElementById('live-clock').innerText = now.toLocaleDateString('ru-RU') + ' | ' + now.toLocaleTimeString('ru-RU');
    }

    function setTodayDate() {
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('booking-date').value = today;
    }

    function populateTimeOptions() {
      const select = document.getElementById('booking-time');
      select.innerHTML = '';
      for (let h = 0; h < 24; h++) {
        for (let m of ['00', '30']) {
          const hh = String(h).padStart(2, '0');
          const timeStr = `${hh}:${m}`;
          const opt = document.createElement('option');
          opt.value = timeStr;
          opt.innerText = timeStr;
          select.appendChild(opt);
        }
      }
      // Устанавливаем ближайший полчаса
      const now = new Date();
      const currentHH = String(now.getHours()).padStart(2, '0');
      select.value = `${currentHH}:00`;
    }

    function renderPcs() {
      const grid = document.getElementById('pc-grid');
      grid.innerHTML = '';
      for (let i = 1; i <= 20; i++) {
        const isSelected = state.selectedPcs.includes(i);
        const card = document.createElement('div');
        card.className = `pc-card glass-panel p-3 rounded-xl border border-slate-800 text-center ${isSelected ? 'pc-selected' : ''}`;
        card.onclick = () => togglePc(i);
        card.innerHTML = `
          <div class="text-xs text-slate-400 mb-1">Игровое место</div>
          <div class="text-lg font-extrabold ${isSelected ? 'text-blue-400' : 'text-white'}">ПК-${i}</div>
          <div class="text-[10px] mt-1 ${isSelected ? 'text-blue-400' : 'text-emerald-400'} font-medium">
            ${isSelected ? 'Выбран' : 'Свободен'}
          </div>
        `;
        grid.appendChild(card);
      }
    }

    function togglePc(id) {
      const index = state.selectedPcs.indexOf(id);
      if (index > -1) {
        state.selectedPcs.splice(index, 1);
      } else {
        state.selectedPcs.push(id);
      }
      document.getElementById('selected-pcs-display').value = state.selectedPcs.length ? state.selectedPcs.map(num => `ПК-${num}`).join(', ') : '';
      renderPcs();
      calculateTotal();
    }

    function changeDrink(type, val) {
      state.drinks[type] = Math.max(0, state.drinks[type] + val);
      document.getElementById(`drink-${type}`).innerText = state.drinks[type];
      calculateTotal();
    }

    function calculateTotal() {
      const tariffSelect = document.getElementById('tariff-select');
      const pcCount = state.selectedPcs.length || 1;
      const tariffPrice = parseInt(tariffSelect.value) || 0;
      
      let drinksTotal = 0;
      for (let key in state.drinks) {
        drinksTotal += state.drinks[key] * drinkPrices[key];
      }

      const total = (tariffPrice * pcCount) + drinksTotal;
      document.getElementById('total-price').innerText = total.toLocaleString('ru-RU') + ' ₸';
    }

    function handleBooking(e) {
      e.preventDefault();
      if (state.selectedPcs.length === 0) {
        alert('Пожалуйста, выберите хотя бы один ПК на карте!');
        return;
      }

      const bookingData = {
        pcs: state.selectedPcs,
        name: document.getElementById('client-name').value,
        phone: document.getElementById('client-phone').value,
        date: document.getElementById('booking-date').value,
        time: document.getElementById('booking-time').value,
        tariff: document.getElementById('tariff-select').options[document.getElementById('tariff-select').selectedIndex].text,
        drinks: state.drinks,
        total: document.getElementById('total-price').innerText
      };

      // Передаем данные на кассу через BroadcastChannel/LocalStorage
      const channel = new BroadcastChannel('ts_club_channel');
      channel.postMessage({ type: 'NEW_BOOKING', payload: bookingData });

      alert('Ваша бронь успешно отправлена на кассу!');
      state.selectedPcs = [];
      document.getElementById('booking-form').reset();
      document.getElementById('selected-pcs-display').value = '';
      renderPcs();
      calculateTotal();
    }
  </script>
</body>
</html>
